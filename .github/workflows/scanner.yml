name: Binance candle scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "sent_signals.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: candle-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scanner.py
      - name: Save sent-signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_signals.json
          git diff --cached --quiet || git commit -m "Update sent signal history"
          git push
